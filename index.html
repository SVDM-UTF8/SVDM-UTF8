<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificación de Acceso - Sistema Persistente Mejorado</title>
    <script src="https://cdn.jsdelivr.net/npm/@fingerprintjs/fingerprintjs@3/dist/fp.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            /* Degradado de morado a azul (del CSS original) */
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 500px;
            overflow: hidden;
            text-align: center;
        }

        .logo {
            text-align: center;
            padding: 25px 0 15px 0;
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            border-bottom: 1px solid #dee2e6;
        }

        .logo img {
            max-width: 120px;
            height: auto;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            opacity: 0.9;
            border: 3px solid white;
        }

        .header {
            /* Degradado de azul oscuro a cian (del CSS original) */
            background: linear-gradient(135deg, #3a7bd5, #00d2ff);
            color: white;
            padding: 20px;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .content {
            padding: 25px;
        }

        /* --- Tarjetas de estado --- */
        .status-card {
            border-radius: 10px;
            padding: 25px 20px;
            margin: 10px 0;
            text-align: center;
            font-weight: bold;
            font-size: 18px;
            min-height: 150px; /* Para mantener consistencia */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .status-icon {
            font-size: 40px;
            line-height: 1;
            margin-bottom: 10px;
        }
        
        /* Loading */
        .loading {
            background-color: #fff4e5;
            color: #e67700;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #e67700;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin-bottom: 10px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }


        /* Authorized (Éxito) */
        .authorized {
            background-color: #d5f5e3;
            color: #27ae60;
            border: 2px solid #2ecc71;
        }
        .authorized .action-text { font-size: 28px; margin-bottom: 5px; }
        .authorized .agent-name { font-size: 20px; font-weight: 600; margin-bottom: 5px; color: #1e8449; }
        .authorized .time-text { font-size: 16px; font-weight: normal; color: #555; }


        /* Unauthorized (Denegado) */
        .unauthorized {
            background-color: #fadbd8;
            color: #c0392b;
            border: 2px solid #e74c3c;
        }
        .unauthorized .reason-text { font-size: 16px; font-weight: normal; margin-top: 10px; }

        .footer {
            margin-top: 20px;
            color: white;
            text-align: center;
            font-size: 14px;
        }
        
        /* Ocultar elementos irrelevantes para el usuario final */
        .persistence-system, .device-info, .persistence-info, .fingerprint-info,
        .instructions, .admin-info, #retry-btn, #recovery-btn, .modal {
            display: none !important;
        }

        /* Responsive para logos */
        @media (max-width: 480px) {
            .logo img { max-width: 100px; }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="logo">
            <img src="images.jpg" alt="Logo Institucional" onerror="this.src='https://i.imgur.com/8QeR3c0.jpeg'"> 
        </div>
        <div class="header">
            <h1>Sistema de Verificación de Acceso</h1>
            <p id="qr-display">Verificando Código QR...</p>
        </div>

        <div class="content">
            <div id="status" class="status-card loading">
                <div class="spinner"></div>
                Verificando dispositivo...
            </div>

            <div class="persistence-system"></div>
            <div class="device-info"></div>
            <div class="persistence-info"></div>
            <div class="fingerprint-info"></div>
            <button id="retry-btn">Reintentar Verificación</button>
            <button id="recovery-btn">¿Perdió su acceso? Recuperar aquí</button>
            <div class="instructions"></div>
            <div class="admin-info"></div>
        </div>
    </div>

    <div class="footer">
        <p>Sistema de Verificación de Acceso con Persistencia Mejorada</p>
    </div>


    <script>
        // -----------------------------------------------------------------
        // --- 🔑 PASO CLAVE: Pega aquí la URL de tu Apps Script /exec ---
        // -----------------------------------------------------------------
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby1-Fgsa_Oyfoh-cOQUHH9gcDMn3Q58b9Bi3t-KZYQyym4vU6iBUkRI1scZO6q1Qy-9CA/exec'; 
        
        const LOCAL_STORAGE_KEY = 'federal_device_uuid';

        // Elementos de la UI
        const statusCard = document.getElementById('status');
        const qrDisplay = document.getElementById('qr-display');

        /**
         * Obtiene el ID del QR desde la URL (?qr=...)
         */
        function getQrId() {
            const params = new URLSearchParams(window.location.search);
            return params.get('qr');
        }

        /**
         * Obtiene el ID persistente de localStorage.
         */
        function getPersistentId() {
            return localStorage.getItem(LOCAL_STORAGE_KEY) || '';
        }

        /**
         * Guarda el ID persistente (usado para recuperación).
         */
        function savePersistentId(id) {
            try {
                localStorage.setItem(LOCAL_STORAGE_KEY, id);
            } catch (e) {
                console.error("No se pudo guardar en localStorage", e);
            }
        }

        /**
         * Obtiene la huella digital robusta usando FingerprintJS
         */
        async function getFingerprint() {
            const fp = await FingerprintJS.load();
            const result = await fp.get();
            return result.visitorId; // Este es un hash robusto
        }

        // --- Funciones de UI adaptadas al nuevo diseño ---

        function showPending() {
            statusCard.className = 'status-card loading';
            statusCard.innerHTML = `
                <div class="spinner"></div>
                Verificando dispositivo...
            `;
        }

        function showSuccess(agente, action, time) {
            statusCard.className = 'status-card authorized';
            statusCard.innerHTML = `
                <div class="status-icon">✅</div>
                <div class="action-text">${action.toUpperCase()} APROBADA</div>
                <div class="agent-name">Agente: ${agente}</div>
                <div class="time-text">Hora: ${time}</div>
            `;
        }

        function showDanger(reason) {
            statusCard.className = 'status-card unauthorized';
            statusCard.innerHTML = `
                <div class="status-icon">❌</div>
                ACCESO DENEGADO
                <div class="reason-text">${reason}</div>
            `;
        }


        /**
         * Función principal: Envía la solicitud al Apps Script
         */
        async function runScanVerification() {
            showPending();
            
            try {
                const qrId = getQrId();
                qrDisplay.textContent = `Punto de Control: ${qrId || 'N/A'}`;
                
                if (!qrId) {
                    showDanger('Código QR inválido en la URL.');
                    return;
                }

                const persistentId = getPersistentId();
                const fingerprint = await getFingerprint();

                // Construir la URL de la API de Apps Script
                const url = new URL(SCRIPT_URL);
                url.searchParams.append('action', 'scan');
                url.searchParams.append('qrId', qrId);
                url.searchParams.append('persistentId', persistentId);
                url.searchParams.append('fingerprint', fingerprint);

                const response = await fetch(url);
                const data = await response.json();

                if (data.status === 'approved') {
                    // ÉXITO
                    showSuccess(data.agente, data.action, data.time);
                    
                    // Si el servidor nos envió un ID para recuperar (ej. si se borró localStorage)
                    if (data.deviceIdToStore) {
                        savePersistentId(data.deviceIdToStore);
                    }
                } else {
                    // DENEGADO
                    showDanger(data.reason || 'Error desconocido');
                }

            } catch (error) {
                console.error('Error en la verificación:', error);
                showDanger('No se pudo conectar con el servidor.');
            }
        }

        // Iniciar el proceso al cargar la página
        window.onload = runScanVerification;
    </script>
</body>
</html>
